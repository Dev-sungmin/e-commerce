services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      USER_SERVICE_DB_PASSWORD: ${USER_SERVICE_DB_PASSWORD}
      LEGACY_SHOP_DB_PASSWORD: ${LEGACY_SHOP_DB_PASSWORD}
      ORDER_SERVICE_DB_PASSWORD: ${ORDER_SERVICE_DB_PASSWORD}
      PAYMENT_SERVICE_DB_PASSWORD: ${PAYMENT_SERVICE_DB_PASSWORD}
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d

  gateway:
    image: ${ECR_REGISTRY}/e-commerce-gateway:latest
    environment:
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8000:8000"
    depends_on:
      - user-service
      - php-legacy
      - order-service
      - cart-service
      - payment-service
      - review-service

  user-service:
    image: ${ECR_REGISTRY}/e-commerce-user-service:latest
    environment:
      DB_USERNAME: ${USER_SERVICE_DB_USERNAME}
      DB_PASSWORD: ${USER_SERVICE_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  php-legacy:
    image: ${ECR_REGISTRY}/e-commerce-php-legacy:latest
    environment:
      DB_HOST: mysql
      DB_NAME: legacy_shop
      DB_USERNAME: legacy_shop_service
      DB_PASSWORD: ${LEGACY_SHOP_DB_PASSWORD}
    ports:
      - "8090:80"
    depends_on:
      mysql:
        condition: service_healthy

  order-service:
    image: ${ECR_REGISTRY}/e-commerce-order-service:latest
    environment:
      DB_USERNAME: ${ORDER_SERVICE_DB_USERNAME}
      DB_PASSWORD: ${ORDER_SERVICE_DB_PASSWORD}
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  cart-service:
    image: ${ECR_REGISTRY}/e-commerce-cart-service:latest
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8082:8082"
    depends_on:
      redis:
        condition: service_healthy

  payment-service:
    image: ${ECR_REGISTRY}/e-commerce-payment-service:latest
    environment:
      DB_USERNAME: ${PAYMENT_SERVICE_DB_USERNAME}
      DB_PASSWORD: ${PAYMENT_SERVICE_DB_PASSWORD}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY}
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy

  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: review_db
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  review-service:
    image: ${ECR_REGISTRY}/e-commerce-review-service:latest
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/review_db?authSource=admin
      ORDER_BASE_URL: http://order-service:8081
    ports:
      - "8084:8084"
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  mongo-data: