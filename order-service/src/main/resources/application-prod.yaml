spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:3306/new_order
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}

php:
  base-url: ${PHP_BASE_URL}