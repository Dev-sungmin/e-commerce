name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check backend paths
        id: check
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'common/**'
              - 'gateway/**'
              - 'user-service/**'
              - 'order-service/**'
              - 'payment-service/**'
              - 'review-service/**'
              - 'build.gradle'
              - 'settings.gradle'

      - name: Set up JDK 17
        if: steps.check.outputs.backend == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        if: steps.check.outputs.backend == 'true'
        run: chmod +x gradlew

      - name: Build with Gradle
        if: steps.check.outputs.backend == 'true'
        run: ./gradlew build -x test

  build-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check php path
        id: check
        uses: dorny/paths-filter@v3
        with:
          filters: |
            php:
              - 'php-legacy/**'

      - name: Set up PHP
        if: steps.check.outputs.php == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Lint PHP files
        if: steps.check.outputs.php == 'true'
        run: find php-legacy/src -name "*.php" -exec php -l {} \;

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check frontend path
        id: check
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'

      - name: Set up Node
        if: steps.check.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.check.outputs.frontend == 'true'
        working-directory: frontend
        run: npm ci

      - name: Lint
        if: steps.check.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Build
        if: steps.check.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run build

  push-images:
    runs-on: ubuntu-latest
    needs: [build-backend, build-php]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push user-service
        run: |
          docker build -f user-service/Dockerfile -t ${{ secrets.ECR_REGISTRY }}/e-commerce-user-service:latest .
          docker push ${{ secrets.ECR_REGISTRY }}/e-commerce-user-service:latest

      - name: Build and push gateway
        run: |
          docker build -f gateway/Dockerfile -t ${{ secrets.ECR_REGISTRY }}/e-commerce-gateway:latest .
          docker push ${{ secrets.ECR_REGISTRY }}/e-commerce-gateway:latest

      - name: Build and push php-legacy
        run: |
          docker build -t ${{ secrets.ECR_REGISTRY }}/e-commerce-php-legacy:latest ./php-legacy
          docker push ${{ secrets.ECR_REGISTRY }}/e-commerce-php-legacy:latest