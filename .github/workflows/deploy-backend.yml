name: Deploy Backend

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy via SSM (pull latest images)
        id: deploy
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "sudo git config --global --add safe.directory /home/ssm-user/e-commerce",
              "cd /home/ssm-user/e-commerce",
              "git pull origin main",
              "export ECR_REGISTRY=${{ secrets.ECR_REGISTRY }}",
              "export $(aws ssm get-parameters-by-path --path /e-commerce/prod --with-decryption --query \"Parameters[*].[Name,Value]\" --output text | awk -F\"\\t\" \"{n=split(\\$1,a,\\\"/\\\"); print a[n]\\\"=\\\"\\$2}\")",
              "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | sudo docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}",
              "sudo -E docker compose -f docker-compose.prod.yml pull",
              "sudo -E docker compose -f docker-compose.prod.yml up -d"
            ]' \
            --query "Command.CommandId" --output text)
          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT

      - name: Wait for deployment
        run: |
          aws ssm wait command-executed \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

      - name: Check result
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"