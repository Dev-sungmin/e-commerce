server:
  port: 8083

spring:
  application:
    name: payment-service
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

toss:
  secret-key: ${TOSS_SECRET_KEY}
  confirm-url: https://api.tosspayments.com/v1/payments/confirm

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}