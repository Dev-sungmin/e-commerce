apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
  namespace: e-commerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cart-service
  template:
    metadata:
      labels:
        app: cart-service
    spec:
      containers:
        - name: cart-service
          image: 384668480652.dkr.ecr.ap-northeast-2.amazonaws.com/e-commerce-cart-service:latest
          ports:
            - containerPort: 8082
          env:
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: REDIS_HOST
            - name: REDIS_PORT
              value: "6379"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"